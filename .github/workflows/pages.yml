name: Deploy Palleta menu to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
  live-smoke:
    name: Smoke test published web app in Chrome
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Test real published GitHub Pages application
        env:
          TEST_URL: https://shmlr.github.io/palleta-menu/
          CHROME_BIN: /usr/bin/google-chrome
        run: node e2e_smoke.cjs