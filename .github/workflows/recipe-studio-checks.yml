name: Draft recipe studio checks
on:
  pull_request:
    paths:
      - 'recipe-studio/**'
      - 'app.js'
      - 'core.js'
      - 'recipes.json'
      - 'products.json'
      - '.github/workflows/recipe-studio-checks.yml'
  push:
    branches: [feature/recipe-experience-v16-draft]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check recipe-studio/app.js
      - run: node --check app.js
      - run: node test_core.cjs
      - run: node test_ui.cjs
      - run: node recipe-studio/test_studio.cjs
      - name: Install Chromium driver for mobile E2E
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Run real Chrome recipe studio interaction tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-http.log 2>&1 &
          node recipe-studio/e2e.cjs
