name: Verify Palleta menu and club-price contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate UT11 club price importer
        run: python3 -m unittest -v test_sync_ut_catalog.py
      - name: Install legacy XLS reader and test fixture writer
        run: python3 -m pip install --disable-pip-version-check xlrd==2.0.2 xlwt==1.3.0
      - name: Validate dated min-max email price importer
        run: python3 -m unittest -v test_minmax_email_import.py
      - name: Validate basket and club pricing
        run: node test_core.cjs
      - name: Validate mobile UI flow
        run: node test_ui.cjs
      - name: Install Chromium driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Test real Chrome against local app, including saved menu
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/palleta-http.log 2>&1 &
          node e2e_smoke.cjs
