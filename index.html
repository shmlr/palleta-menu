<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Паллета | Меню на неделю</title><meta name="theme-color" content="#254A74">
<meta name="description" content="Подберите ужины и получите предварительную корзину. Проверка цен и наличия перед заказом обязательна.">
<style>
:root{color-scheme:light;--blue:#254A74;--red:#DD463C;--bg:#F4F7FA;--ink:#192A3D;--muted:#57697C;--card:white;--line:#D9E2EA;--soft:#EBF2F8;--warning:#FFF4D8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:640px;margin:0 auto;padding:0 16px 56px}header{margin:0 -16px 20px;background:var(--blue);color:white;padding:20px 18px 18px;border-bottom:5px solid var(--red)}header strong{font-size:22px;letter-spacing:.015em}header span{font-size:14px;display:block;opacity:.9}h1{font-size:29px;line-height:1.15;margin:16px 0}h2{font-size:22px;margin:20px 0 12px}p{margin:8px 0 15px}.muted{color:var(--muted);font-size:14px}.note{padding:12px 14px;border-radius:12px;background:var(--warning);border:1px solid #E7D39A;margin:14px 0;font-size:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:14px 0}.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar>span{height:100%;background:var(--blue);display:block;transition:width .2s}.choices{display:grid;gap:9px;margin-top:18px}.choices.cols{grid-template-columns:repeat(3,1fr)}button,select{font:inherit}button{cursor:pointer}.choice{padding:13px;border-radius:11px;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);min-height:55px}.choice.selected{border-color:var(--blue);background:var(--soft)}.choices.cols .choice{text-align:center}.btn{border:0;border-radius:12px;padding:14px 16px;background:var(--blue);color:white;font-weight:700;width:100%;margin-top:12px}.btn.secondary{color:var(--blue);background:#fff;border:2px solid var(--line)}.btn:focus-visible,.choice:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}.btn:disabled{opacity:.6;cursor:not-allowed}.day{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}.day b{color:var(--red);min-width:28px}.day span{flex:1}.day small{color:var(--muted)}.value{font-size:29px;font-weight:800;color:var(--blue)}.product{padding:14px 0;border-top:1px solid var(--line)}.product:first-child{border-top:none}.product-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline}.product-head b{display:block}.amount{font-weight:700;white-space:nowrap}.small{font-size:13px;color:var(--muted)}.product select{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--ink)}.label{font-size:12px;font-weight:700;color:var(--blue);border-radius:4px;background:var(--soft);padding:2px 5px;display:inline-block;margin-left:4px}.warning{color:#945C00}.success{color:#15704A}footer{font-size:12px;color:var(--muted);margin-top:28px}.link{color:var(--blue)}details{margin-top:12px}summary{cursor:pointer}.hide{display:none}
</style>
</head>
<body><main><header><strong>ПАЛЛЕТА</strong><span>Для большой семейной закупки · меню на неделю</span></header>
<div id="app" aria-live="polite"><div class="panel">Загружаем меню и каталог...</div></div>
<footer>Пилот v0.3. Здесь нет автоматического соединения с 1С, актуальные цены и наличие нужно подтвердить в магазине перед оформлением заказа.</footer>
</main><script src="./app.js" defer></script></body></html>
